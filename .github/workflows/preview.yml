name: Branch previews

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review]
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview ID: main or pr-N'
        default: main
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.preview || 'main' }}
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.repository == 'jotjern/monoweb' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_ACTION: ${{ github.event.action }}
      MANUAL_PREVIEW: ${{ inputs.preview }}
      PREVIEW_PUBLIC_HOST: ${{ vars.PREVIEW_PUBLIC_HOST }}
      PREVIEW_PRIVATE_HOST: ${{ vars.PREVIEW_PRIVATE_HOST }}
      PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
    steps:
      # No repository checkout and no provisioning credentials on the runner.
      - name: Configure restricted deployment access
        env:
          DEPLOY_KEY: ${{ secrets.PREVIEW_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PREVIEW_SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/preview_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host preview-jump
            HostName $PREVIEW_PUBLIC_HOST
            User monoweb-preview-jump
            IdentityFile ~/.ssh/preview_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          Host preview-vps
            HostName $PREVIEW_PRIVATE_HOST
            User preview-deploy
            IdentityFile ~/.ssh/preview_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ProxyJump preview-jump
            ServerAliveInterval 30
          EOF
      - name: Deploy or remove preview
        run: |
          set -euo pipefail
          preview="${MANUAL_PREVIEW:-main}"
          if [[ -n "$PR_NUMBER" ]]; then preview="pr-$PR_NUMBER"; fi
          [[ "$preview" =~ ^(main|pr-[1-9][0-9]*)$ ]] || exit 1
          if [[ "$EVENT_ACTION" == closed ]]; then
            ssh preview-vps "destroy $preview"
          else
            if [[ "$preview" == main ]]; then
              commit_sha=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
            else
              commit_sha=$(gh api "repos/$REPOSITORY/pulls/${preview#pr-}" --jq .head.sha)
            fi
            [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
            ssh preview-vps "deploy $preview $commit_sha"
            printf 'Preview: https://%s.%s\n' "$preview" "$PREVIEW_BASE_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          fi
