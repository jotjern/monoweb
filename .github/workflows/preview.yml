name: Branch previews

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed, ready_for_review]
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview ID: main or pr-N'
        default: main
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.preview || 'main' }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'jotjern/monoweb'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - run: python3 -m unittest discover -s infra/preview -p 'test_*.py'

  deploy:
    needs: validate
    if: >-
      github.repository == 'jotjern/monoweb' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_ACTION: ${{ github.event.action }}
      MANUAL_PREVIEW: ${{ inputs.preview }}
      PREVIEW_DEPLOY_URL: ${{ vars.PREVIEW_DEPLOY_URL }}
      PREVIEW_BASE_DOMAIN: ${{ vars.PREVIEW_BASE_DOMAIN }}
    steps:
      # Internal branches are trusted. Only the preview-scoped deployment token
      # is available here; PlanetScale/Auth0 provisioning keys stay on the VPS.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Deploy or remove preview
        env:
          PREVIEW_DEPLOY_TOKEN: ${{ secrets.PREVIEW_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          preview="${MANUAL_PREVIEW:-main}"
          if [[ -n "$PR_NUMBER" ]]; then preview="pr-$PR_NUMBER"; fi
          [[ "$preview" =~ ^(main|pr-[1-9][0-9]*)$ ]] || exit 1
          if [[ "$EVENT_ACTION" == closed ]]; then
            python3 infra/preview/deploy_client.py destroy "$preview"
          else
            if [[ "$preview" == main ]]; then
              commit_sha=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
            else
              commit_sha=$(gh api "repos/$REPOSITORY/pulls/${preview#pr-}" --jq .head.sha)
            fi
            [[ "$commit_sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
            python3 infra/preview/deploy_client.py deploy "$preview" "$commit_sha"
            printf 'Preview: https://%s.%s\n' "$preview" "$PREVIEW_BASE_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
          fi
