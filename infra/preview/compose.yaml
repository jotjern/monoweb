# Coolify injects its environment and proxy labels. Dockerfiles stay shared with normal builds.
services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        AUTH0_CLIENT_ID: ${WEB_AUTH0_CLIENT_ID}
        AUTH0_CLIENT_SECRET: ${WEB_AUTH0_CLIENT_SECRET}
    environment:
      AUTH0_CLIENT_ID: ${WEB_AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${WEB_AUTH0_CLIENT_SECRET}
    volumes:
      - preview-context:/run/preview:ro
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/api/auth/session]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
  rpc:
    build:
      context: .
      dockerfile: apps/rpc/Dockerfile
    environment:
      AUTH0_CLIENT_ID: ${RPC_AUTH0_CLIENT_ID}
      AUTH0_CLIENT_SECRET: ${RPC_AUTH0_CLIENT_SECRET}
    volumes:
      - preview-context:/run/preview:ro
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.5
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:4444/health]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

volumes:
  preview-context:
